# scale-selector 档位表（P2；session p2-001）
# 语法：
#   gears=<id>[,<id>...]            菜单顺序；id 仅允许小写字母/数字/连字符
#   <id>_label=显示名               （键名中 id 的 "-" 写作 "_"）
#   <id>_mode=active|disabled       disabled=显示但不可选；缺省按 disabled
#   <id>_reason=禁用/占位原因       菜单原样展示
#   <id>_set=属性=值;属性+=值2      该档位写入的属性（P2 内建档位不使用，
#                                   仅测试桩档位使用，见 docs/验证/开发/p2-001/）
# 说明：
#   * P2 真实档位：fsr1 / sgsr1 / anime4k / nearest 为内建档位。它们的 mode、
#     链定义、标签与原因全部内建于脚本（防冒名/防换链），本文件对它们写的
#     _mode/_set/_label/_reason 一律无效并产生解析告警。
#       - fsr1    = AMD FidelityFX FSR v1.0.2（EASU+RCAS，LUMA，MIT；每轴≤2×，
#                   超出由 mpv 接管；资源 shaders/p2-FSR1.glsl，适配版哈希在案）
#       - sgsr1   = Qualcomm SGSR1（LUMA 适配版，BSD-3，单 pass；资源
#                   shaders/p2-SGSR1.glsl）
#       - anime4k = 本机 stock Anime4K v4 CTRL+1..6 精确链的零改动副本
#                   （shaders/anime4k/，链模式由 scale-selector.conf 的
#                   anime4k_chain=a..f 选择，默认 a=CTRL+1）
#       - nearest = scale/cscale/dscale 全 nearest（显式点采样，无 shader 链，
#                   不设 RGB/HDR LUMA 守卫）
#   * RGB/HDR 守卫：fsr1/sgsr1/anime4k 为 LUMA 档；输入 pixelformat 为 RGB 系
#     或 gamma∈{pq,hlg} 时拒用并在菜单/OSD 显示真实原因；播放中变为 RGB/HDR
#     时释放插件自有链并如实回退。
#   * 解析器硬保证（不依赖本文件）：off 恒存在、恒在首项、恒可用，显示名固定
#     为「关」（conf 的 off_label 不能改，防借保留算法名冒名）；未实现占位档位
#     （LS1/BCAS/NIS/xBR/SharpBilinear/Integer）无论本地 conf 怎么写都强制
#     disabled 且使用内建固定标签/原因；自定义档位不得用保留算法名作 label；
#     重复 id/重复键只保留首个并告警。
#   * off 档位为内建恢复语义，不接受 _set。
#   * LS1：无公开源码/权重/移植许可，无法原样内置。
#   * BCAS：算法定义身份未核实，不以 CAS/Bicubic+CAS 冒名。
gears=off,ls1,fsr1,nis,sgsr1,bcas,anime4k,xbr,sharpbilinear,integer,nearest

off_label=关

ls1_label=LS1
ls1_mode=disabled
ls1_reason=无公开源码/权重/移植许可，无法原样内置；不以替代算法冒名

fsr1_label=FSR1
fsr1_mode=active
fsr1_reason=AMD FidelityFX FSR v1.0.2（EASU+RCAS，MIT；每轴≤2×，超出由 mpv 接管）

nis_label=NIS
nis_mode=disabled
nis_reason=未实现/后续阶段（P3：NVScaler compute，内含锐化）

sgsr1_label=SGSR1
sgsr1_mode=active
sgsr1_reason=Qualcomm SGSR1（LUMA 适配版，BSD-3，单 pass）

bcas_label=BCAS
bcas_mode=disabled
bcas_reason=算法定义身份未核实；不以CAS/Bicubic+CAS冒名

anime4k_label=Anime4K（stock v4）
anime4k_mode=active
anime4k_reason=stock Anime4K v4（CTRL+1..6 等效链，零改动副本）

xbr_label=xBR
xbr_mode=disabled
xbr_reason=未实现/后续阶段（P3：选定版本移植，xBR≠xBRZ）

sharpbilinear_label=Sharp Bilinear
sharpbilinear_mode=disabled
sharpbilinear_reason=未实现/后续阶段（P3：AUTO/手动2× 分列）

integer_label=Integer（整数倍）
integer_mode=disabled
integer_reason=未实现/后续阶段（P3：Lua几何+nearest，黑边明示）

nearest_label=Nearest Neighbor
nearest_mode=active
nearest_reason=scale/cscale/dscale 全 nearest（显式点采样，无 shader 链）
