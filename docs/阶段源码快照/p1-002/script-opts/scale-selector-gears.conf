# scale-selector 档位表（P1 骨架；p1-002 限域修正同源文件）
# 语法：
#   gears=<id>[,<id>...]            菜单顺序；id 仅允许小写字母/数字/连字符
#   <id>_label=显示名               （键名中 id 的 "-" 写作 "_"）
#   <id>_mode=active|disabled       disabled=显示但不可选；缺省按 disabled
#   <id>_reason=禁用/占位原因       菜单原样展示
#   <id>_set=属性=值;属性+=值2      该档位写入的属性（P1 产品档位不使用；
#                                   仅测试桩档位使用，见 docs/验证/开发/p1-001/README.md）
# 说明：
#   * P1 仅"关"可选；其余为禁用占位，不写任何属性，不以任何替代算法冒名。
#   * 解析器硬保证（不依赖本文件）：off 恒存在、恒在首项、恒可用，不能被配置
#     删除/禁用/后置；保留算法 id（LS1/BCAS 等未实现档位）无论本地 conf 如何写
#     （省略 _mode/显式 active/配 _set/改 _label/_reason）都强制 disabled 且使用
#     内建固定标签/原因；自定义档位不得用保留算法名作 label；重复 id/重复键
#     只保留首个并告警。
#   * off 档位为内建恢复语义，不接受 _set。
#   * LS1：无公开源码/权重/移植许可，无法原样内置。
#   * BCAS：算法定义身份未核实，不以 CAS/Bicubic+CAS 冒名。
gears=off,ls1,fsr1,nis,sgsr1,bcas,anime4k,xbr,sharpbilinear,integer,nearest

off_label=关

ls1_label=LS1
ls1_mode=disabled
ls1_reason=无公开源码/权重/移植许可，无法原样内置；不以替代算法冒名

fsr1_label=FSR1
fsr1_mode=disabled
fsr1_reason=未实现/后续阶段（P2：EASU+RCAS，MIT，每轴≤2×）

nis_label=NIS
nis_mode=disabled
nis_reason=未实现/后续阶段（P3：NVScaler compute，内含锐化）

sgsr1_label=SGSR1
sgsr1_mode=disabled
sgsr1_reason=未实现/后续阶段（P2：Qualcomm SGSR1 LUMA 适配，BSD-3）

bcas_label=BCAS
bcas_mode=disabled
bcas_reason=算法定义身份未核实；不以CAS/Bicubic+CAS冒名

anime4k_label=Anime4K（stock v4）
anime4k_mode=disabled
anime4k_reason=未实现/后续阶段（P2：引用本机 stock 链，零修改）

xbr_label=xBR
xbr_mode=disabled
xbr_reason=未实现/后续阶段（P3：选定版本移植，xBR≠xBRZ）

sharpbilinear_label=Sharp Bilinear
sharpbilinear_mode=disabled
sharpbilinear_reason=未实现/后续阶段（P3：AUTO/手动2× 分列）

integer_label=Integer（整数倍）
integer_mode=disabled
integer_reason=未实现/后续阶段（P3：Lua几何+nearest，黑边明示）

nearest_label=Nearest Neighbor
nearest_mode=disabled
nearest_reason=未实现/后续阶段（P2：内建 scale=nearest）
