# scale-selector 档位表（P3；session p3-001）
# 语法：
#   gears=<id>[,<id>...]            菜单顺序；id 仅允许小写字母/数字/连字符
#   <id>_label=显示名               （键名中 id 的 "-" 写作 "_"）
#   <id>_mode=active|disabled       disabled=显示但不可选；缺省按 disabled
#   <id>_reason=禁用/占位原因       菜单原样展示
#   <id>_set=属性=值;属性+=值2      该档位写入的属性（内建档位不使用，
#                                   仅测试桩档位使用）
# 说明（P3 唯一目标态，P3A-01 对齐）：
#   * 九个真实档位为内建档位：fsr1 / sgsr1 / anime4k / nearest（P2）与
#     nis / xbr / sharpbilinear / sharpbilinear2x / integer（P3）。它们的
#     mode、链定义、标签与原因全部内建于脚本（防冒名/防换链），本文件对
#     它们写的 _mode/_set/_label/_reason 一律无效并产生解析告警——因此对
#     真实内建档位，本文件只保留 gears= 成员与 # 注释；严禁写 _mode=active
#     等无效键凑审计身份。
#       - fsr1    = AMD FidelityFX FSR v1.0.2（EASU+RCAS，LUMA，MIT；每轴≤2×，
#                   超出由 mpv 接管；资源 shaders/p2-FSR1.glsl，适配版哈希在案）
#       - sgsr1   = Qualcomm SGSR1（LUMA 适配版，BSD-3，单 pass；资源
#                   shaders/p2-SGSR1.glsl）
#       - anime4k = 本机 stock Anime4K v4 CTRL+1..6 精确链的零改动副本
#                   （shaders/anime4k/，链模式由 scale-selector.conf 的
#                   anime4k_chain=a..f 选择，默认 a=CTRL+1）
#       - nearest = scale/cscale/dscale 全 nearest（显式点采样，无 shader 链，
#                   不设 RGB/HDR LUMA 守卫）
#       - nis     = NVIDIA Image Scaling v1.0.2（compute 32×24×256 + 两张
#                   2×64 rgba32f 系数纹理，MIT；内含锐化，绝不叠 NVSharpen；
#                   全 barrier 后逐像素边界 guard；仅放大生效，非放大时按
#                   WHEN 诚实跳过；资源 shaders/p3-NIS.glsl）
#       - xbr     = Hyllian xBR-lv2（libretro 参考 MIT 版移植为 MAIN RGB
#                   hook；参考 3× 预缩放 + mpv 后续缩放模式明示；xBR≠xBRZ；
#                   资源 shaders/p3-xBR-lv2.glsl）
#       - sharpbilinear  = Sharp Bilinear AUTO（floor(输出高/输入高+0.01)；
#                   1080→1440 得 1 即明示「退化为双线性」；不足 1× 钳制为 1
#                   防除零；资源 shaders/p3-Sharp-Bilinear-AUTO.glsl）
#       - sharpbilinear2x= Sharp Bilinear 手动 2×（同源参考固定预缩放 2×，
#                   与 AUTO 分别命名；资源 shaders/p3-Sharp-Bilinear-2x.glsl）
#       - integer = 整数倍缩放：k=floor(min(原窗口像素/有效显示尺寸))；
#                   video-unscaled=yes + video-zoom=log2(k) + 三核 nearest；
#                   窗口来源是原窗口像素与 video-out-params（含旋转/crop/SAR
#                   后的 dw/dh），绝不从自身缩小后的 osd-margin 推导；k<1 为
#                   诚实回退（普通 nearest 缩小，不裁切）；黑边明示
#   * RGB/HDR 守卫：fsr1/sgsr1/anime4k/nis 为 LUMA 档；输入 pixelformat 为
#     RGB 系或 gamma∈{pq,hlg} 时拒用并在菜单/OSD 显示真实原因。xbr/
#     sharpbilinear/sharpbilinear2x 为 MAIN RGB 档：支持 RGB 输入，但设
#     独立的 HDR 守卫（gamma∈{pq,hlg} 拒用；HDR 守卫独立于 LUMA 守卫）。
#     播放中变为守卫拒绝状态时释放插件自有链并如实回退。
#   * 解析器硬保证（不依赖本文件）：off 恒存在、恒在首项、恒可用，显示名固定
#     为「关」（conf 的 off_label 不能改，防借保留算法名冒名）；未实现占位档位
#     （LS1/BCAS）无论本地 conf 怎么写都强制 disabled 且使用内建固定标签/原因；
#     自定义档位不得用保留算法名作 label；重复 id/重复键只保留首个并告警。
#   * off 档位为内建恢复语义，不接受 _set。
#   * LS1：无公开源码/权重/移植许可，无法原样内置。
#   * BCAS：算法定义身份未核实，不以 CAS/Bicubic+CAS 冒名。
gears=off,ls1,fsr1,nis,sgsr1,bcas,anime4k,xbr,sharpbilinear,sharpbilinear2x,integer,nearest

off_label=关

ls1_label=LS1
ls1_mode=disabled
ls1_reason=无公开源码/权重/移植许可，无法原样内置；不以替代算法冒名

bcas_label=BCAS
bcas_mode=disabled
bcas_reason=算法定义身份未核实；不以CAS/Bicubic+CAS冒名

# —— 以下为 P2 档位的条目（P2 镜像审计 p2_builtins_active 保持不变；
#    P3 迁移不删除也不新增其覆盖键；解析器对这些覆盖键的告警行为与 P2 相同）——
fsr1_label=FSR1
fsr1_mode=active
fsr1_reason=AMD FidelityFX FSR v1.0.2（EASU+RCAS，MIT；每轴≤2×，超出由 mpv 接管）

sgsr1_label=SGSR1
sgsr1_mode=active
sgsr1_reason=Qualcomm SGSR1（LUMA 适配版，BSD-3，单 pass）

anime4k_label=Anime4K（stock v4）
anime4k_mode=active
anime4k_reason=stock Anime4K v4（CTRL+1..6 等效链，零改动副本）

nearest_label=Nearest Neighbor
nearest_mode=active
nearest_reason=scale/cscale/dscale 全 nearest（显式点采样，无 shader 链）
